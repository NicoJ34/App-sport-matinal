<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Callistenik">
<meta name="theme-color" content="#0e1014">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Callistenik</title>
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --text:#15171c; --muted:#686d77; --line:#e4e0d6; --chip:#ebe7dd;
  --accent:#e4572e; --accent-ink:#ffffff; --ok:#1f8a6a; --danger:#c0392b;
  --work:#e4572e; --rest:#1d7f62; --warm:#3457c2; --cool:#6a4fbd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --surface:#171a20; --text:#f1efe9; --muted:#969ca7; --line:#272b33; --chip:#21252d;
    --accent:#ff6a3d; --ok:#3fb68f; --danger:#ff6b5b;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#171a20; --text:#f1efe9; --muted:#969ca7; --line:#272b33; --chip:#21252d;
  --accent:#ff6a3d; --ok:#3fb68f; --danger:#ff6b5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.screen{display:none}
.screen.on{display:block}

/* ---------- Accueil ---------- */
#home,#hist{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 112px);max-width:520px;margin:0 auto}
#hist{padding-bottom:calc(env(safe-area-inset-bottom) + 32px)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.date{font-size:15px;color:var(--muted);text-transform:capitalize}
.streak{font-size:15px;font-weight:600;white-space:nowrap}
h1{font-size:30px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.5px}
.meta{color:var(--muted);font-size:15px;margin-bottom:16px}
.done-badge{display:inline-block;background:var(--ok);color:#fff;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;margin-bottom:12px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;height:40px;border-radius:9px;font-weight:600;font-size:16px;color:var(--muted)}
.seg button.sel{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{height:38px;padding:0 14px;border-radius:99px;background:var(--chip);font-size:15px;font-weight:500;color:var(--text)}
.chip.sel{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .n{width:22px;flex:none;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.ex .t{font-weight:600;font-size:16px}
.ex .c{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.lvl{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.blk{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:10px 0 2px}
.simple{font-size:15px;line-height:1.7;color:var(--text)}
.link{display:block;margin:6px auto 0;color:var(--accent);font-weight:600;font-size:16px;padding:10px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.4}
.startbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.start{display:block;width:100%;max-width:488px;margin:0 auto;height:64px;border-radius:18px;background:var(--accent);
  color:var(--accent-ink);font-size:21px;font-weight:700;letter-spacing:.2px}
.start:active{transform:scale(.98)}

/* ---------- Suivi ---------- */
.iconbtn{font-size:15px;font-weight:600;color:var(--accent);padding:4px 0 4px 12px}
.htop{display:flex;justify-content:space-between;align-items:center}
.back{color:var(--accent);font-weight:600;font-size:17px;padding:8px 0}
.ver{font-size:13px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.card h2 button.nav{color:var(--accent);font-size:24px;width:40px;height:30px;line-height:1}
.card h2 .ml{color:var(--text);text-transform:capitalize;letter-spacing:0;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:12px;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums}
.cal .d.done{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.future{color:var(--muted);opacity:.5}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.hrow:first-child{border-top:0}
.hrow .r{display:flex;align-items:center;gap:8px;white-space:nowrap}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.del{width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:15px;background:var(--chip);flex:none}
.del.armed{width:auto;padding:0 10px;background:var(--danger);color:#fff;font-weight:600;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:16px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.toggle{width:52px;height:32px;border-radius:99px;background:var(--chip);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on{background:var(--ok)}
.toggle.on::after{transform:translateX(20px)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sbtn{height:46px;border-radius:12px;background:var(--chip);font-weight:600;font-size:15px}
.sbtn.armed{background:var(--danger);color:#fff}
.msg{font-size:13.5px;color:var(--ok);min-height:18px;margin-top:8px;text-align:center}

/* ---------- Séance ---------- */
#run{position:fixed;inset:0;color:#fff;background:var(--work);transition:background-color .35s ease;
  padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px)}
#run.on{display:flex;flex-direction:column}
#run.k-work{background:var(--work)} #run.k-rest{background:var(--rest)}
#run.k-warm,#run.k-prep{background:var(--warm)} #run.k-cool{background:var(--cool)}
#run.k-switch{background:#2b2f38}
#run.paused{filter:saturate(.35) brightness(.85)}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600;opacity:.9}
.quit{height:36px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.18);font-size:14px;font-weight:600;flex:none}
.quit.armed{background:#fff;color:#c0392b}
.rmain{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:0}
.phase{font-size:15px;font-weight:700;letter-spacing:2px;opacity:.85}
.exname{font-size:clamp(28px,8.5vw,40px);font-weight:800;line-height:1.08;margin:8px 0 8px;letter-spacing:-.5px}
.cue{font-size:17px;line-height:1.35;opacity:.92;max-width:420px;margin:0 auto;min-height:46px}
.badges{display:flex;justify-content:center;gap:8px;margin-top:10px;min-height:26px}
.side,.rlv{display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.22);font-weight:700;font-size:14px}
.side:empty,.rlv:empty{display:none}
.timer{font-size:clamp(110px,40vw,170px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-4px;margin:8px 0 2px}
.pausetxt{font-size:16px;font-weight:700;letter-spacing:2px;height:20px;opacity:.95}
.next{font-size:16px;opacity:.88;margin-top:6px;min-height:22px}
.easier{align-self:center;margin-top:12px;height:38px;padding:0 16px;border-radius:99px;border:1.5px solid rgba(255,255,255,.6);font-size:15px;font-weight:600;visibility:hidden}
.easier.show{visibility:visible}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden;margin:12px 0 14px}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px}
.ctrls{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr;gap:10px}
.ctrls button{height:64px;border-radius:18px;background:rgba(255,255,255,.18);font-size:18px;font-weight:700}
.ctrls button.big{background:#fff;color:#15171c}
.ctrls button:active{transform:scale(.96)}

/* ---------- Fin ---------- */
#end{padding:calc(env(safe-area-inset-top) + 40px) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:520px;margin:0 auto;text-align:center}
.bravo{font-size:44px;font-weight:800;letter-spacing:-1px;margin:8px 0}
.stats{display:flex;justify-content:center;gap:28px;margin:18px 0 30px}
.stats b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.q{font-size:18px;font-weight:600;margin-bottom:12px}
.fb{display:grid;gap:10px}
.fb button{height:58px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:17px;font-weight:600}
.fb button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.thanks{color:var(--ok);font-weight:600;min-height:24px;margin-top:12px;line-height:1.4;font-size:15px}
</style>
</head>
<body>

<!-- ===== Accueil ===== -->
<section id="home" class="screen on">
  <div class="top"><div class="date" id="hDate"></div><div><span class="streak" id="hStreak"></span><button class="iconbtn" id="histBtn">📅 Suivi</button></div></div>
  <h1 id="hTitle"></h1>
  <div class="meta" id="hMeta"></div>
  <div id="hDone"></div>
  <div class="seg" id="segDur">
    <button data-d="15">15 min</button><button data-d="20">20 min</button>
  </div>
  <div class="chips">
    <button class="chip" id="cLegs">🦵 Préserver les jambes</button>
    <button class="chip" id="cSilent">🤫 Silencieux</button>
    <button class="chip" id="cVoice">🗣️ Voix</button>
  </div>
  <div id="hPlan"></div>
  <button class="link" id="reroll">↻ Autre séance</button>
  <p class="hint" id="hHint"></p>
  <div class="startbar"><button class="start" id="startBtn">Démarrer</button></div>
</section>

<!-- ===== Suivi ===== -->
<section id="hist" class="screen">
  <div class="htop"><button class="back" id="histBack">‹ Retour</button><span class="ver">Callistenik v0.3</span></div>
  <h1>Suivi</h1>
  <div class="statgrid">
    <div class="stat"><b id="sMonth">0</b><span>séances ce mois</span></div>
    <div class="stat"><b id="sMin">0</b><span>minutes ce mois</span></div>
    <div class="stat"><b id="sStreak">0</b><span>série actuelle</span></div>
    <div class="stat"><b id="sBest">0</b><span>meilleure série</span></div>
  </div>
  <div class="card"><h2><button class="nav" id="mPrev" aria-label="Mois précédent">‹</button><span class="ml" id="mLabel"></span><button class="nav" id="mNext" aria-label="Mois suivant">›</button></h2><div class="cal" id="cal"></div></div>
  <div class="card"><h2><span>Dernières séances</span></h2><div id="hList"></div></div>
  <div class="card"><h2><span>Progression</span></h2><div id="pList"></div></div>
  <div class="card"><h2><span>Réglages</span></h2>
    <div class="row"><span>Bips</span><button class="toggle" id="tBeeps" aria-label="Bips"></button></div>
    <div class="row"><span>Voix</span><button class="toggle" id="tVoice" aria-label="Voix"></button></div>
    <div class="row"><span>Mode silencieux (sans sauts)</span><button class="toggle" id="tSilent" aria-label="Mode silencieux"></button></div>
    <button class="link" id="testSound">🔊 Tester le son</button>
    <div class="btnrow">
      <button class="sbtn" id="exportBtn">⬆︎ Sauvegarder</button>
      <button class="sbtn" id="importBtn">⬇︎ Restaurer</button>
    </div>
    <div class="btnrow" style="grid-template-columns:1fr"><button class="sbtn" id="resetLv">Remettre les niveaux à zéro</button></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div class="msg" id="setMsg"></div>
  </div>
</section>

<!-- ===== Séance ===== -->
<section id="run" class="screen">
  <div class="rtop"><span id="rInfo"></span><button class="quit" id="quitBtn">Quitter</button></div>
  <div class="rmain" id="rTap">
    <div class="phase" id="rPhase"></div>
    <div class="exname" id="rName"></div>
    <div class="cue" id="rCue"></div>
    <div class="badges"><span class="rlv" id="rLv"></span><span class="side" id="rSide"></span></div>
    <div class="timer" id="rTimer">0</div>
    <div class="pausetxt" id="rPause"></div>
    <div class="next" id="rNext"></div>
    <button class="easier" id="rEasier">↓ Version plus facile</button>
  </div>
  <div class="bar"><i id="rBar"></i></div>
  <div class="ctrls">
    <button id="bMinus">−10</button>
    <button id="bPlus">+10</button>
    <button class="big" id="bPause">Pause</button>
    <button id="bSkip">⏭</button>
  </div>
</section>

<!-- ===== Fin ===== -->
<section id="end" class="screen">
  <div style="font-size:56px">🎉</div>
  <div class="bravo">Bravo !</div>
  <div class="stats">
    <div><b id="eTime"></b><span>durée</span></div>
    <div><b id="eEx"></b><span>exercices</span></div>
    <div><b id="eStreak"></b><span>série</span></div>
  </div>
  <div class="q">Comment c'était ?</div>
  <div class="fb" id="fb">
    <button data-f="easy">😌 Trop facile</button>
    <button data-f="ok">💪 Parfait</button>
    <button data-f="hard">🥵 Trop dur</button>
  </div>
  <div class="thanks" id="thanks"></div>
  <button class="link" id="homeBtn">Retour à l'accueil</button>
  <button class="link" id="endHist" style="margin-top:0">📅 Voir le suivi</button>
</section>

<script>
"use strict";
/* =========================================================
   Bibliothèque d'exercices — tapis de sol uniquement
   cat : push | pull | legs | core | cardio | warm | mob | cool
   tags : noise = sauts ; legs = sollicite fortement les jambes
   sw : unilatéral → 5 s pour changer de côté à mi-temps
   l1 / l3 : version plus facile / plus difficile [nom, consigne]
             (le niveau 2 = name / cue)
   ========================================================= */
const EX = [
  // Poussée
  {id:"pushup",  cat:"push", name:"Pompes", cue:"Corps gainé, coudes à 45°, poitrine près du sol.",
   l1:["Pompes sur les genoux","Corps aligné des genoux à la tête, coudes à 45°."],
   l3:["Pompes tempo 3-1-1","Descente en 3 s, 1 s en bas, remontée explosive."]},
  {id:"pike",    cat:"push", name:"Pompes pike", cue:"Fesses hautes en V inversé, descends la tête entre les mains.",
   l1:["V inversé tenu","Fesses hautes, pousse le sol, épaules actives. Tiens."],
   l3:["Pompes pike pieds rapprochés","Pieds près des mains, buste presque vertical."]},
  {id:"diamond", cat:"push", name:"Pompes diamant", cue:"Mains jointes sous la poitrine, coudes serrés le long du corps.",
   l1:["Pompes diamant sur les genoux","Mains jointes, coudes serrés, sur les genoux."],
   l3:["Pompes diamant tempo","Descente en 3 s, coudes collés au corps."]},
  {id:"hindu",   cat:"push", name:"Pompes hindoues", cue:"Du chien tête en bas, plonge vers l'avant jusqu'au cobra, puis reviens.",
   l1:["Chien tête en bas ↔ planche","Passe du V inversé à la planche, bras tendus."],
   l3:["Pompes hindoues + pause cobra","Tiens 2 s en cobra à chaque passage."]},
  {id:"wide",    cat:"push", name:"Pompes mains larges", cue:"Mains plus larges que les épaules, descente lente et contrôlée.",
   l1:["Pompes larges sur les genoux","Mains larges, descente contrôlée."],
   l3:["Pompes archer","Un bras plié, l'autre tendu sur le côté. Alterne."]},
  {id:"updown",  cat:"push", name:"Planche haute ↔ basse", cue:"Passe des coudes aux mains et inversement, bassin immobile.",
   l1:["Planche haute ↔ basse genoux","Sur les genoux, passe des coudes aux mains."],
   l3:["Planche basse → pompe","Remonte sur les mains et enchaîne une pompe."]},
  {id:"taps",    cat:"push", name:"Shoulder taps", cue:"Planche bras tendus, touche l'épaule opposée sans balancer le bassin.",
   l1:["Shoulder taps sur les genoux","Genoux au sol, touche l'épaule opposée."],
   l3:["Shoulder taps pieds joints","Pieds serrés, bassin parfaitement immobile."]},
  // Tirage (sans barre)
  {id:"ytw",     cat:"pull", name:"Superman Y-T-W", cue:"Allongé sur le ventre, bras en Y, puis T, puis W. Omoplates serrées.",
   l1:["Y-T-W front au sol","Front posé, petits mouvements, omoplates serrées."],
   l3:["Y-T-W + maintien 2 s","Tiens 2 s chaque position, poitrine décollée."]},
  {id:"snow",    cat:"pull", name:"Reverse snow angels", cue:"Allongé ventre, bras décollés, balaye des hanches jusqu'au-dessus de la tête.",
   l1:["Snow angels bras pliés","Coudes pliés, amplitude réduite."],
   l3:["Snow angels lents","4 s par passage, bras bien hauts."]},
  {id:"suppull", cat:"pull", name:"Superman pulls", cue:"Allongé ventre, bras devant, tire les coudes vers les hanches en serrant le dos.",
   l1:["Superman pulls jambes au sol","Seul le haut du corps décolle."],
   l3:["Superman pulls jambes levées","Jambes décollées en permanence."]},
  {id:"revplank",cat:"pull", name:"Planche inversée", cue:"Assis, mains derrière toi, monte le bassin, corps aligné, regard au plafond.",
   l1:["Pont table","Genoux pliés, pieds à plat, monte le bassin à l'horizontale."],
   l3:["Planche inversée + jambe levée","Alterne une jambe levée, bassin haut."]},
  {id:"birddog", cat:"pull", name:"Bird dog", cue:"À 4 pattes, tends bras et jambe opposés, alterne lentement, dos plat.",
   l1:["Bird dog avec pause","Repose main et genou entre chaque répétition."],
   l3:["Bird dog coude-genou","Ramène coude et genou sous le ventre, puis tends."]},
  {id:"swim",    cat:"pull", name:"Nage au sol", cue:"Allongé ventre, bras et jambes décollés, petits battements alternés.",
   l1:["Nage au sol bras seuls","Jambes au sol, battements de bras."],
   l3:["Nage au sol rapide","Battements rapides, poitrine haute."]},
  // Jambes
  {id:"squat",   cat:"legs", tags:["legs"], name:"Squats", cue:"Pieds largeur d'épaules, fesses en arrière, talons au sol.",
   l1:["Squats partiels","Descends à mi-hauteur, talons au sol."],
   l3:["Squats tempo 3-1-1","Descente en 3 s, 1 s en bas, remontée rapide."]},
  {id:"revlunge",cat:"legs", tags:["legs"], name:"Fentes arrière alternées", cue:"Grand pas en arrière, le genou arrière frôle le tapis.",
   l1:["Fentes arrière courtes","Petit pas, descente partielle."],
   l3:["Fente arrière + genou haut","En remontant, monte le genou à hauteur de hanche."]},
  {id:"bridge",  cat:"legs", name:"Pont fessier", cue:"Sur le dos, pousse dans les talons, serre les fessiers en haut 1 s.",
   l1:["Pont fessier lent","Montée et descente lentes, petite amplitude."],
   l3:["Pont fessier + 3 s en haut","Tiens 3 s en haut, fessiers serrés."]},
  {id:"slbridge",cat:"legs", tags:["legs"], sw:true, name:"Pont fessier unijambe", cue:"Une jambe tendue en l'air, pousse dans le talon au sol.",

/* Thèmes et formats de la semaine (0 = dimanche) */
const THEMES = {
  1:{id:"push_core",  title:"Poussée + gainage",        fmt:"circuit", slots:["push","core","push","core","pull"]},
  2:{id:"mob_legs",   title:"Mobilité + jambes douces", fmt:"circuit", slots:["legs","mob","core","legs","mob"]},
  3:{id:"full",       title:"Full body",                fmt:"pyramid", slots:["legs","push","core","pull","cardio"]},
  4:{id:"pull_core",  title:"Dos + gainage",            fmt:"circuit", slots:["pull","core","pull","core","push"]},
  5:{id:"full_cardio",title:"Full body cardio",         fmt:"tabata",  slots:["cardio","push","legs","core","cardio","pull"]},
  6:{id:"legs_core",  title:"Jambes + gainage",         fmt:"pyramid", slots:["legs","core","legs","pull","legs"]},
  0:{id:"mobility",   title:"Mobilité & récupération",  fmt:"circuit", slots:["mob","mob","core","mob","mob"]},
};
const FMT_NAME = {circuit:"Circuit", pyramid:"Pyramide", tabata:"Tabata"};
const T = {prep:10, warm:30, cool:30, switch:5, trans:3, slot:60, tabWork:20, tabRest:10, tabBreak:60};
const PYR = {2:[30,45], 3:[30,45,30]};          // secondes d'effort par tour (pyramide)
const WORK_MIN = 30, WORK_MAX = 45, WORK_DEF = 40; // circuit : effort adaptatif, repos = 60 − effort

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const FAST = Math.max(1, Number(params.get("fast")) || 1); // test : accélère le minuteur
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const TODAY = params.get("date") || ymd(new Date());
function seedOf(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h>>>0; }
function rngFor(str){ let a = seedOf(str); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60), r = s%60; return m ? m+":"+String(r).padStart(2,"0") : String(r); };
const clone = o => JSON.parse(JSON.stringify(o));

try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e) {}
if (!S.prog) S.prog = {};

/* ---------- niveaux & progression ---------- */
const hasLv = e => !!e.l1;
function P(id){ return S.prog[id] || {lv:2, work:WORK_DEF, ok:0, easy:0}; }
function setP(id, p){ S.prog[id] = p; }
const lvOf = e => hasLv(e) ? P(e.id).lv : 0;
const nm = e => { const l = lvOf(e); return l === 1 ? e.l1[0] : l === 3 ? e.l3[0] : e.name; };
const cu = e => { const l = lvOf(e); return l === 1 ? e.l1[1] : l === 3 ? e.l3[1] : e.cue; };
const workOf = e => Math.min(WORK_MAX, Math.max(WORK_MIN, P(e.id).work));

// Ajuste la progression après le ressenti de fin de séance. Retourne la liste des changements.
function applyFeedback(fb, ids, format){
  const changes = [];
  for (const id of [...new Set(ids)]){
    const e = EXBY[id]; if (!e) continue;
    const p = {...P(id)}, before = {...p};
    if (fb === "easy"){
      p.easy++; p.ok = 0;
      if (format === "circuit" && p.work < WORK_MAX) p.work += 5;
      if (hasLv(e) && p.easy >= 2 && p.lv < 3){ p.lv++; p.easy = 0; p.work = WORK_DEF; }
    } else if (fb === "ok"){
      p.ok++; p.easy = 0;
      if (p.ok >= 3){ p.ok = 0; if (p.work < WORK_MAX) p.work += 5; else if (hasLv(e) && p.lv < 3){ p.lv++; p.work = WORK_DEF; } }
    } else if (fb === "hard"){
      p.easy = 0; p.ok = 0;
      if (p.work > WORK_MIN) p.work -= 5; else if (hasLv(e) && p.lv > 1){ p.lv--; p.work = WORK_DEF; }
    }
    setP(id, p);
    if (p.lv !== before.lv) changes.push({id, kind: p.lv > before.lv ? "up" : "down"});
    else if (p.work !== before.work) changes.push({id, kind: p.work > before.work ? "plus" : "minus"});
  }
  return changes;
}
function describeChanges(changes, format, fb){
  const lv = changes.filter(c => c.kind === "up" || c.kind === "down");
  const plus = changes.filter(c => c.kind === "plus").length, minus = changes.filter(c => c.kind === "minus").length;
  const parts = lv.map(c => `${c.kind === "up" ? "⬆︎" : "⬇︎"} ${EXBY[c.id].name} → niveau ${P(c.id).lv} (${nm(EXBY[c.id])})`);
  if (plus)  parts.push(`+5 s d'effort sur ${plus} exercice${plus > 1 ? "s" : ""} (séances en circuit)`);
  if (minus) parts.push(`−5 s d'effort sur ${minus} exercice${minus > 1 ? "s" : ""} (séances en circuit)`);
  if (parts.length) return "Ajusté pour la suite :<br>" + parts.map(esc).join("<br>");
  if (fb === "easy") return "Noté ✓ — encore un « trop facile » sur ces exercices et ils passent au niveau supérieur.";
  if (fb === "ok")   return "Noté ✓ — après 3 « parfait », l'effort augmente un peu.";
  return "Noté ✓ — on garde ce niveau.";
}

/* ---------- générateur de séance ---------- */
function pool(cat, opt){
  let p = cat === "mob" ? EX.filter(e => e.cat === "mob" || e.cat === "cool") : EX.filter(e => e.cat === cat);
  if (opt.silent)   p = p.filter(e => !e.tags.includes("noise"));
  if (opt.preserve) p = p.filter(e => !e.tags.includes("legs"));
  return p;
}
function generate(date, opt, exclude = new Set()){
  const rng = rngFor(date + "|" + opt.reroll);
  const theme = THEMES[parseYmd(date).getDay()];
  const format = theme.fmt, rounds = opt.duration >= 20 ? 3 : 2;
  const count = format === "tabata" ? 2 * rounds : 5;
  let slots = Array.from({length:count}, (_, i) => theme.slots[i % theme.slots.length]), changed = false;
  if (opt.preserve){
    const sub = ["core","push","pull","mob"]; let k = 0;
    slots = slots.map(s => (s === "legs" || s === "cardio") ? (changed = true, sub[k++ % sub.length]) : s);
  }
  const used = new Set(), main = [];
  for (const s of slots){
    const okFmt = e => format !== "tabata" || !e.sw;   // pas d'unilatéral en Tabata (20 s)
    const base = pool(s, opt).filter(e => !used.has(e.id) && okFmt(e));
    let c = base.filter(e => !exclude.has(e.id));
    if (!c.length) c = base.length ? base : pool(s, opt).filter(okFmt);
    const e = c[Math.floor(rng() * c.length)];
    used.add(e.id); main.push(e);
  }
  const subset = (arr, n) => {
    let a = arr.filter(e => !used.has(e.id));
    if (a.length < n) a = arr;
    return a.map((e,i) => [rng(), i]).sort((x,y) => x[0]-y[0]).slice(0, n).map(x => x[1]).sort((x,y) => x-y).map(i => a[i]);
  };
  const warm = subset(EX.filter(e => e.cat === "warm"), 6);
  const cool = subset(EX.filter(e => e.cat === "cool"), 4);
  return {date, theme, format, rounds, title: theme.title + (changed ? " · jambes préservées" : ""), main, warm, cool};
}
function buildToday(){
  const opt = {reroll:S.day.reroll, preserve:S.day.preserve, silent:S.silent, duration:S.duration};
  const y = parseYmd(TODAY); y.setDate(y.getDate() - 1);
  const prev = generate(ymd(y), {...opt, reroll:0, preserve:false});
  return generate(TODAY, opt, new Set(prev.main.map(e => e.id)));
}
function buildSteps(p){
  const st = [{kind:"prep", base:"prep", ex:p.warm[0], dur:T.prep}];
  // exercice unilatéral : côté 1 → 5 s pour changer → côté 2
  const add = (kind, e, dur, extra) => {
    if (!e.sw){ st.push({kind, base:kind, ex:e, dur, ...extra}); return; }
    const half = Math.round(dur / 2);
    st.push({kind, base:kind, ex:e, dur:half, side:1, ...extra});
    st.push({kind:"switch", base:kind, ex:e, dur:T.switch, ...extra});
    st.push({kind, base:kind, ex:e, dur:dur - half, side:2, ...extra});
  };
  // 3 s de transition entre deux exercices d'échauffement / de retour au calme
  const trans = (base, e, info) => st.push({kind:"trans", base, ex:e, dur:T.trans, info});
  p.warm.forEach((e,i) => {
    const info = `Échauffement · ${i+1}/${p.warm.length}`;
    if (i > 0) trans("warm", e, info);
    add("warm", e, T.warm, {info});
  });
  if (p.format === "tabata"){
    for (let b = 0; b < p.rounds; b++){
      const A = p.main[2*b], B = p.main[2*b+1];
      st.push({kind:"rest", base:"rest", ex:A, dur:T.tabBreak, info:`Tabata · bloc ${b+1}/${p.rounds}`, pair:B});
      for (let k = 0; k < 8; k++){
        const e = k % 2 ? B : A, info = `Tabata · bloc ${b+1}/${p.rounds} · ${k+1}/8`;
        st.push({kind:"work", base:"work", ex:e, dur:T.tabWork, info});
        if (k < 7) st.push({kind:"rest", base:"rest", ex:k % 2 ? A : B, dur:T.tabRest, info, short:true});
        else st.push({kind:"rest", base:"rest", ex:e, dur:T.tabRest, info, short:true, endBlock:true});
      }
    }
  } else {
    for (let r = 1; r <= p.rounds; r++)
      p.main.forEach((e,i) => {
        const w = p.format === "pyramid" ? PYR[p.rounds][r-1] : workOf(e);
        const info = `${FMT_NAME[p.format]} · tour ${r}/${p.rounds} · ${i+1}/${p.main.length}`;
        st.push({kind:"rest", base:"rest", ex:e, dur:T.slot - w, info});
        add("work", e, w, {info});
      });
  }
  p.cool.forEach((e,i) => {
    const info = `Retour au calme · ${i+1}/${p.cool.length}`;
    trans("cool", e, info);
    add("cool", e, T.cool, {info});
  });
  return st;
}

/* ---------- accueil ---------- */
let plan = null;
function streak(){
  const days = new Set(S.history.filter(h => h.done).map(h => h.date));
  const d = parseYmd(TODAY); if (!days.has(TODAY)) d.setDate(d.getDate() - 1);
  let n = 0; while (days.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function exRow(e, n, extra){
  const l = lvOf(e);
  return `<div class="ex"><div class="n">${n}</div><div><div class="t">${esc(nm(e))}${l ? `<span class="lvl">niv. ${l}</span>` : ""}${e.sw ? " <small>(2 côtés)</small>" : ""}${extra ? ` <small>${extra}</small>` : ""}</div><div class="c">${esc(cu(e))}</div></div></div>`;
}
function mainCard(p){
  if (p.format === "tabata"){
    let h = `<div class="card"><h2><span>Tabata · ${p.rounds} blocs</span><span>20 s / 10 s × 8</span></h2>`;
    for (let b = 0; b < p.rounds; b++)
      h += `<div class="blk">Bloc ${b+1} · alterné</div>` + exRow(p.main[2*b], "A") + exRow(p.main[2*b+1], "B");
    return h + `</div>`;
  }
  if (p.format === "pyramid")
    return `<div class="card"><h2><span>Pyramide · ${p.rounds} tours</span><span>${PYR[p.rounds].join(" → ")} s</span></h2>` +
      p.main.map((e,i) => exRow(e, i+1)).join("") + `</div>`;
  return `<div class="card"><h2><span>Circuit · ${p.rounds} tours</span><span>effort / 60 s</span></h2>` +
    p.main.map((e,i) => exRow(e, i+1, workOf(e) + " s")).join("") + `</div>`;
}
function renderHome(){
  plan = buildToday();
  const total = buildSteps(plan).reduce((a,s) => a + s.dur, 0);
  $("#hDate").textContent = parseYmd(TODAY).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
  const n = streak(); $("#hStreak").textContent = n ? "🔥 " + n + (n > 1 ? " jours" : " jour") : "";
  $("#hTitle").textContent = plan.title;
  $("#hMeta").textContent = Math.round(total/60) + " min · " + FMT_NAME[plan.format] + " · " + plan.main.length + " exercices";
  const doneToday = S.history.some(h => h.date === TODAY && h.done);
  $("#hDone").innerHTML = doneToday ? '<span class="done-badge">✓ Séance du jour faite</span>' : "";
  $("#startBtn").textContent = doneToday ? "Refaire une séance" : "Démarrer";
  document.querySelectorAll("#segDur button").forEach(b => b.classList.toggle("sel", Number(b.dataset.d) === S.duration));
  $("#cLegs").classList.toggle("sel", S.day.preserve);
  $("#cSilent").classList.toggle("sel", S.silent);
  $("#cVoice").classList.toggle("sel", S.voice);
  $("#hPlan").innerHTML =
    `<div class="card"><h2><span>Échauffement</span><span>3 min</span></h2><div class="simple">${plan.warm.map(e => esc(e.name)).join(" · ")}</div></div>` +
    mainCard(plan) +
    `<div class="card"><h2><span>Retour au calme</span><span>2 min</span></h2><div class="simple">${plan.cool.map(e => esc(e.name)).join(" · ")}</div></div>`;
  $("#hHint").textContent = ("wakeLock" in navigator) ? "" :
    "Astuce : si l'écran se met en veille pendant la séance, règle Réglages › Luminosité › Verrouillage auto sur « Jamais » le matin.";
}
document.querySelectorAll("#segDur button").forEach(b => b.onclick = () => { S.duration = Number(b.dataset.d); save(); renderHome(); });
$("#cLegs").onclick   = () => { S.day.preserve = !S.day.preserve; save(); renderHome(); };
$("#cSilent").onclick = () => { S.silent = !S.silent; save(); renderHome(); };
$("#cVoice").onclick  = () => { S.voice = !S.voice; save(); renderHome(); };
$("#reroll").onclick  = () => { S.day.reroll++; save(); renderHome(); window.scrollTo({top:0, behavior:"smooth"}); };

/* ---------- son, voix, écran allumé ---------- */
let actx = null, frVoice = null, wl = null;
function unlockAudio(){
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e) {}
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();
    const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource();
    s.buffer = b; s.connect(actx.destination); s.start(0);
  } catch(e) {}
  try { if ("speechSynthesis" in window){ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch(e) {}
}
function beep(f = 880, d = .12, v = .3, delay = 0){
  if (!S.beeps || !actx) return;
  try {
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .03);
  } catch(e) {}
}
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  frVoice = vs.find(v => /fr[-_]FR/i.test(v.lang) && /Thomas|Amélie|Audrey|Aurélie/i.test(v.name)) || vs.find(v => /^fr/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t){
  if (!S.voice || !("speechSynthesis" in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "fr-FR"; if (frVoice) u.voice = frVoice; u.rate = 1.05; speechSynthesis.speak(u); } catch(e) {}
}
async function lockOn(){ try { if ("wakeLock" in navigator && !wl) { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); } } catch(e) {} }
function lockOff(){ try { wl && wl.release(); } catch(e) {} wl = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && run && !run.paused) lockOn(); });

/* ---------- moteur de séance (basé sur l'heure réelle) ---------- */
let run = null, ticker = null, lastRun = null;
const PH = {prep:"PRÉPARE-TOI", warm:"ÉCHAUFFEMENT", rest:"REPOS · PROCHAIN", work:"EFFORT", cool:"RETOUR AU CALME", switch:"CHANGE DE CÔTÉ", trans:"ENSUITE"};
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function startWorkout(){
  unlockAudio(); lockOn();
  const steps = buildSteps(plan);
  run = {steps, i:0, end:Date.now() + steps[0].dur*1000/FAST, paused:false, left:0, beeped:null,
         total:steps.reduce((a,s) => a + s.dur, 0), started:Date.now(), pausedMs:0, pauseAt:0};
  show("run"); enterStep(); clearInterval(ticker); ticker = setInterval(tick, 100); tick();
}
function nextExName(i){
  const st = run.steps, cur = st[i].ex.id;
  for (let j = i+1; j < st.length; j++) if (st[j].ex.id !== cur) return nm(st[j].ex);
  return "fin de séance 🎉";
}
function enterStep(quiet){
  const s = run.steps[run.i];
  run.beeped = null;
  $("#run").className = "screen on k-" + (s.kind === "trans" ? s.base : s.kind) + (run.paused ? " paused" : "");
  $("#rPhase").textContent = s.endBlock ? "FIN DU BLOC" : PH[s.kind];
  $("#rName").textContent = s.endBlock ? "Respire" : nm(s.ex) + (s.pair ? " + " + nm(s.pair) : "");
  $("#rCue").textContent = s.endBlock ? "" : s.pair ? "Alterne A et B : 20 s d'effort, 10 s de repos, 8 fois." : cu(s.ex);
  $("#rSide").textContent = s.kind === "switch" ? "Côté 2 ensuite" : s.side ? "Côté " + s.side : "";
  const l = lvOf(s.ex);
  $("#rLv").textContent = l && (s.kind === "work" || (s.kind === "rest" && !s.endBlock)) && !s.pair ? "Niveau " + l : "";
  $("#rInfo").textContent = s.info || "C'est parti dans…";
  $("#rNext").textContent = s.kind === "prep" || s.kind === "trans" ? "" : "Ensuite : " + (s.kind === "switch" ? "côté 2" : s.pair ? nm(s.ex) : nextExName(run.i));
  $("#rEasier").classList.toggle("show", hasLv(s.ex) && l > 1 && (s.kind === "work" || s.kind === "rest") && !s.endBlock && !s.pair);
  if (quiet) return;
  const prev = run.steps[run.i - 1];
  if (s.kind === "switch"){ beep(740,.15,.3); beep(740,.15,.3,.2); say("Change de côté"); }
  else if (s.side === 2){ beep(988,.15,.35); beep(1319,.3,.35,.18); say("Côté 2 !"); }
  else if (s.kind === "work"){ beep(988,.15,.35); beep(1319,.3,.35,.18); say(nm(s.ex) + " !"); }
  else if (s.kind === "rest" && s.short){ beep(660,.25,.3); }
  else if (s.kind === "rest" && s.pair){ beep(660,.3,.3); say("Tabata. " + nm(s.ex) + " et " + nm(s.pair)); }
  else if (s.kind === "rest"){ beep(660,.3,.3); say((prev && prev.kind === "work" ? "Repos. " : "") + "Ensuite : " + nm(s.ex)); }
  else if (s.kind === "prep"){ say("Prépare-toi. Échauffement : " + s.ex.name); }
  else if (s.kind === "trans"){ beep(600,.15,.25); say((s.base === "cool" && prev && prev.base !== "cool" ? "Retour au calme. " : "") + s.ex.name); }
  else if (s.kind === "warm"){ beep(784,.2,.3); }
  else if (s.kind === "cool"){ beep(523,.3,.3); }
}
function tick(){
  if (!run || run.paused) return;
  const now = Date.now();
  let skipped = 0;
  while (now >= run.end){
    run.i++;
    if (run.i >= run.steps.length){ finish(); return; }
    run.end += run.steps[run.i].dur*1000/FAST;
    skipped++;
  }
  if (skipped) enterStep(skipped > 1);
  render(now);
}
function render(now){
  const s = run.steps[run.i];
  const leftMs = run.paused ? run.left : run.end - now;
  const sec = Math.ceil(leftMs/1000*FAST);
  $("#rTimer").textContent = fmt(sec);
  if (!run.paused && sec <= 3 && sec >= 1 && run.beeped !== sec && s.dur > 5){ run.beeped = sec; beep(880,.1,.3); }
  const doneSec = run.steps.slice(0, run.i).reduce((a,x) => a + x.dur, 0) + (s.dur - leftMs/1000*FAST);
  $("#rBar").style.width = Math.min(100, doneSec / run.total * 100) + "%";
}
function togglePause(){
  if (!run) return;
  if (run.paused){ run.end = Date.now() + run.left; run.paused = false; run.pausedMs += Date.now() - run.pauseAt; lockOn(); }
  else { run.left = run.end - Date.now(); run.paused = true; run.pauseAt = Date.now(); try { speechSynthesis.cancel(); } catch(e) {} }
  $("#run").classList.toggle("paused", run.paused);
  $("#bPause").textContent = run.paused ? "Reprendre" : "Pause";
  $("#rPause").textContent = run.paused ? "EN PAUSE" : "";
  render(Date.now());
}
function adjust(sec){
  if (!run) return;
  const ms = sec*1000/FAST;
  if (run.paused) run.left = Math.max(1000/FAST, run.left + ms);
  else run.end = Math.max(Date.now() + 1000/FAST, run.end + ms);
  run.total += sec; render(Date.now());
}
function skip(){
  if (!run) return;
  run.i++;
  if (run.i >= run.steps.length){ finish(); return; }
  const d = run.steps[run.i].dur*1000/FAST;
  if (run.paused) run.left = d; else run.end = Date.now() + d;
  enterStep(); render(Date.now());
}
function easier(ev){
  ev.stopPropagation();
  if (!run) return;
  const e = run.steps[run.i].ex;
  if (!hasLv(e)) return;
  const p = {...P(e.id)};
  if (p.lv > 1){ p.lv--; p.work = WORK_DEF; p.easy = 0; p.ok = 0; setP(e.id, p); save(); }
  enterStep(true);
  say(nm(e));
}
let quitTimer = null;
function quit(){
  const b = $("#quitBtn");
  if (!b.classList.contains("armed")){
    b.classList.add("armed"); b.textContent = "Confirmer ?";
    quitTimer = setTimeout(() => { b.classList.remove("armed"); b.textContent = "Quitter"; }, 3000);
    return;
  }
  clearTimeout(quitTimer); b.classList.remove("armed"); b.textContent = "Quitter";
  stopRun(); show("home"); renderHome();
}
function stopRun(){
  clearInterval(ticker); ticker = null; lockOff();
  try { speechSynthesis.cancel(); } catch(e) {}
  run = null;
  $("#bPause").textContent = "Pause"; $("#rPause").textContent = "";
}
function finish(){
  const realSec = Math.round((Date.now() - run.started - run.pausedMs)/1000*FAST);
  S.history.push({date:TODAY, theme:plan.theme.id, title:plan.title, format:plan.format, dur:realSec,
                  ex:plan.main.map(e => e.id), rounds:plan.rounds, preserve:S.day.preserve, fb:null, done:true});
  lastRun = {progBefore: clone(S.prog), ids: plan.main.map(e => e.id), format: plan.format};
  save(); stopRun();
  beep(784,.15,.35); beep(988,.15,.35,.16); beep(1319,.4,.35,.32);
  say("Séance terminée. Bravo !");
  $("#eTime").textContent = fmt(realSec);
  $("#eEx").textContent = plan.main.length + plan.warm.length + plan.cool.length;
  $("#eStreak").textContent = "🔥 " + streak();
  document.querySelectorAll("#fb button").forEach(b => b.classList.remove("sel"));
  $("#thanks").textContent = "";
  show("end");
}
$("#startBtn").onclick = startWorkout;
$("#rTap").onclick = togglePause;
$("#rEasier").onclick = easier;
$("#bPause").onclick = togglePause;
$("#bMinus").onclick = () => adjust(-10);
$("#bPlus").onclick = () => adjust(10);
$("#bSkip").onclick = skip;
$("#quitBtn").onclick = quit;
document.querySelectorAll("#fb button").forEach(b => b.onclick = () => {
  const last = S.history[S.history.length - 1];
  if (!last || !lastRun) return;
  S.prog = clone(lastRun.progBefore);            // on peut changer d'avis : on repart de l'état d'avant
  const changes = applyFeedback(b.dataset.f, lastRun.ids, lastRun.format);
  last.fb = b.dataset.f; save();
  document.querySelectorAll("#fb button").forEach(x => x.classList.toggle("sel", x === b));
  $("#thanks").innerHTML = describeChanges(changes, lastRun.format, b.dataset.f);
});
$("#homeBtn").onclick = () => { show("home"); renderHome(); window.scrollTo(0,0); };

/* ---------- suivi ---------- */
let calMonth = null;
function bestStreak(){
  const days = [...new Set(S.history.filter(h => h.done).map(h => h.date))].sort();
  let best = 0, cur = 0, prev = null;
  for (const d of days){
    if (prev){ const p = parseYmd(prev); p.setDate(p.getDate() + 1); cur = ymd(p) === d ? cur + 1 : 1; } else cur = 1;
    best = Math.max(best, cur); prev = d;
  }
  return best;
}
function renderHist(){
  const t = parseYmd(TODAY);
  if (!calMonth) calMonth = new Date(t.getFullYear(), t.getMonth(), 1);
  const done = S.history.filter(h => h.done);
  const month = done.filter(h => h.date.startsWith(TODAY.slice(0,7)));
  $("#sMonth").textContent = month.length;
  $("#sMin").textContent = Math.round(month.reduce((a,h) => a + (h.dur || 0), 0) / 60);
  $("#sStreak").textContent = streak();
  $("#sBest").textContent = bestStreak();
  $("#mLabel").textContent = calMonth.toLocaleDateString("fr-FR", {month:"long", year:"numeric"});
  const days = new Set(done.map(h => h.date));
  let html = ["L","M","M","J","V","S","D"].map(x => `<div class="dow">${x}</div>`).join("");
  for (let i = 0, off = (calMonth.getDay() + 6) % 7; i < off; i++) html += "<div></div>";
  const n = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0).getDate();
  for (let d = 1; d <= n; d++){
    const ds = ymd(new Date(calMonth.getFullYear(), calMonth.getMonth(), d)), c = ["d"];
    if (days.has(ds)) c.push("done"); if (ds === TODAY) c.push("today"); if (ds > TODAY) c.push("future");
    html += `<div class="${c.join(" ")}">${d}</div>`;
  }
  $("#cal").innerHTML = html;
  const FB = {easy:"😌", ok:"💪", hard:"🥵"};
  const rows = S.history.map((h, i) => ({h, i})).filter(x => x.h.done).slice(-10).reverse();
  $("#hList").innerHTML = rows.length ? rows.map(({h, i}) =>
    `<div class="hrow"><div><div>${esc(h.title || "")}</div><div class="sub">${parseYmd(h.date).toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"})}${h.format ? " · " + FMT_NAME[h.format] : ""}${h.preserve ? " · jambes préservées" : ""}</div></div>` +
    `<div class="r">${fmt(h.dur || 0)} ${FB[h.fb] || ""}<button class="del" data-i="${i}" aria-label="Supprimer">✕</button></div></div>`).join("")
    : '<div class="sub">Aucune séance pour l\'instant — à demain matin !</div>';
  const progRows = EX.filter(e => hasLv(e) && S.prog[e.id] && (P(e.id).lv !== 2 || P(e.id).work !== WORK_DEF))
    .sort((a,b) => P(b.id).lv - P(a.id).lv);
  $("#pList").innerHTML = progRows.length ? progRows.map(e =>
    `<div class="hrow"><div><div>${esc(nm(e))}</div><div class="sub">${esc(e.name)} · effort circuit ${P(e.id).work} s</div></div><div class="r"><span class="lvl">niv. ${P(e.id).lv}</span></div></div>`).join("")
    : '<div class="sub">Tous les exercices sont au niveau 2. Ton ressenti en fin de séance les fera évoluer : 2 « trop facile » → niveau supérieur ; « trop dur » → effort réduit puis niveau inférieur.</div>';
  $("#tBeeps").classList.toggle("on", S.beeps);
  $("#tVoice").classList.toggle("on", S.voice);
  $("#tSilent").classList.toggle("on", S.silent);
}
function openHist(){ calMonth = null; $("#setMsg").textContent = ""; show("hist"); renderHist(); window.scrollTo(0,0); }
$("#histBtn").onclick = openHist;
$("#endHist").onclick = openHist;
$("#histBack").onclick = () => { show("home"); renderHome(); window.scrollTo(0,0); };
$("#mPrev").onclick = () => { calMonth.setMonth(calMonth.getMonth() - 1); renderHist(); };
$("#mNext").onclick = () => { calMonth.setMonth(calMonth.getMonth() + 1); renderHist(); };
$("#tBeeps").onclick  = () => { S.beeps = !S.beeps; save(); renderHist(); };
$("#tVoice").onclick  = () => { S.voice = !S.voice; save(); renderHist(); };
$("#tSilent").onclick = () => { S.silent = !S.silent; save(); renderHist(); };
$("#testSound").onclick = () => {
  unlockAudio();
  const b = S.beeps; S.beeps = true; beep(988,.15,.35); beep(1319,.3,.35,.18); S.beeps = b;
  const v = S.voice; S.voice = true; say("Le son fonctionne. Bonne séance !"); S.voice = v;
};
// Suppression d'une séance : 1er tap = arme, 2e tap = supprime
$("#hList").addEventListener("click", ev => {
  const b = ev.target.closest(".del"); if (!b) return;
  if (!b.classList.contains("armed")){
    document.querySelectorAll("#hList .del.armed").forEach(x => { x.classList.remove("armed"); x.textContent = "✕"; });
    b.classList.add("armed"); b.textContent = "Supprimer";
    setTimeout(() => { if (b.isConnected){ b.classList.remove("armed"); b.textContent = "✕"; } }, 3000);
    return;
  }
  S.history.splice(Number(b.dataset.i), 1); save(); renderHist();
  $("#setMsg").textContent = "Séance supprimée.";
});
// Sauvegarde / restauration
$("#exportBtn").onclick = async () => {
  const data = JSON.stringify({app:"callistenik", saved:new Date().toISOString(), state:S}, null, 1);
  const name = "callistenik-" + TODAY + ".json";
  try {
    const f = new File([data], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:"Sauvegarde Callistenik"}); $("#setMsg").textContent = "Sauvegarde prête ✓"; return; }
  } catch(e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  $("#setMsg").textContent = "Sauvegarde téléchargée ✓";
};
$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const o = JSON.parse(await f.text()), st = o.state || o;
    if (!Array.isArray(st.history)) throw new Error("format");
    S = {...S, ...st, day:S.day, prog:st.prog || {}}; save(); renderHist();
    $("#setMsg").textContent = `Restauré ✓ (${st.history.length} séances)`;
  } catch(e) { $("#setMsg").textContent = "Fichier non reconnu."; }
  ev.target.value = "";
};
$("#resetLv").onclick = () => {
  const b = $("#resetLv");
  if (!b.classList.contains("armed")){
    b.classList.add("armed"); b.textContent = "Confirmer la remise à zéro ?";
    setTimeout(() => { b.classList.remove("armed"); b.textContent = "Remettre les niveaux à zéro"; }, 3000);
    return;
  }
  S.prog = {}; save(); b.classList.remove("armed"); b.textContent = "Remettre les niveaux à zéro"; renderHist();
  $("#setMsg").textContent = "Niveaux remis à zéro.";
};

/* ---------- hors-ligne (service worker) ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:" && location.hostname.endsWith("github.io")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

renderHome();
</script>
